; i2c-find -- which XIAO pins the I2C wires actually land on (js-rocket-avionics #7)
;
;     pio run -t upload && pio device monitor
;
; For XIAO-ESP32S3-cam. Never upload with XIAO-ESP32S3-lora plugged in.
;
; Run it when bringup-cam reports "nothing on the bus" with the sensors' power
; LEDs lit. It finds the pins carrying external pull-ups -- the I2C lines, since
; both breakouts pull SDA and SCL up -- and scans for devices on every pair of
; them. On 2026-09-12 it found SDA on D3 and SCL on D4, one pin short of D4/D5.

[env:seeed_xiao_esp32s3]
platform      = espressif32@55.3.35
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
