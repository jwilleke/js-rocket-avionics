; soak-power -- the load half of js-rocket-avionics #8
; https://github.com/jwilleke/js-rocket-avionics/issues/8
;
;     pio run -t upload            # flash over USB
;     then UNPLUG USB and run the board from the battery
;
; #8 asks whether a camera brownout on XIAO-ESP32S3-cam disturbs
; XIAO-ESP32S3-lora on a shared 500 mAh battery. This project is the load and the
; recorder for that test: it drives the worst case the flight build can produce
; -- capture, then an SD write burst -- and writes one CSV line per cycle to the
; card, so the record survives the reset it is trying to catch.
;
; THE TEST RUNS ON BATTERY. USB-C powers the board, so a run with the monitor
; attached measures nothing about the battery. Flash over USB, unplug, then read
; the card afterwards. Serial output exists for a bench sanity pass only.

[env:seeed_xiao_esp32s3]
; Pinned. `espressif32` unpinned resolves to whatever that machine's registry
; offers, and this repo's whole reason for using PlatformIO over a .ino is that
; the build is in the file rather than in machine state. 55.3.35 is what these
; projects were built against, and its board definition is where PSRAM, the
; OPI memory type and the partition table actually come from.
platform      = espressif32@55.3.35
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200

; Same three flags as bringup-cam, for the same reasons. -DBOARD_HAS_PSRAM is
; not optional: the frame buffers live in PSRAM and without it esp_camera_init
; fails with an error that reads like a hardware fault.
;
; All three are ALREADY in the board definition's extra_flags, so restating them
; changes nothing today -- see firmware/sense-board-PlatformIO.md. They are kept
; because they are load-bearing and a board definition is not ours: an upstream
; edit that dropped one would otherwise be silent, and the failure it produces
; reads as a hardware fault.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---- knobs, all optional -----------------------------------------------------
;
; SOAK_VBAT_PIN / SOAK_VBAT_DIVIDER
;   The XIAO ESP32S3 has NO on-board battery-voltage divider -- BAT+/BAT- are
;   bare pads. Without external resistors this firmware still catches every
;   brownout (the chip's own detector names the reset), it just cannot say what
;   the rail did on the way down. Fit a divider from BAT+ to an ADC pin and the
;   voltage columns fill in:
;
;       BAT+ --[ R1 ]--+--[ R2 ]-- GND        divider = (R1 + R2) / R2
;                      |
;                      +-- D1 (GPIO2, ADC1_CH1)
;
;   Two 100k gives divider 2.0 and draws ~21 uA, which is nothing against 300 mA.
;   D1 is free: D0 is the buzzer, D4/D5 are I2C, the camera and SD own the rest.
;
;     -DSOAK_VBAT_PIN=2
;     -DSOAK_VBAT_DIVIDER=2.0f
;
; SOAK_FRAMESIZE     capture size. SVGA matches bringup-cam. UXGA is the harsher
;                    case -- bigger frame, longer write burst, deeper sag
; SOAK_PERIOD_MS     minimum ms between cycles. 0 = flat out, the worst case
; SOAK_BEEP_EVERY    chirp on D0 every N cycles so an unmonitored run is audible.
;                    0 disables. The chirp is part of the load, which is honest:
;                    the flight build beeps too
;
;build_flags = ${env.build_flags}
;    -DSOAK_VBAT_PIN=2
;    -DSOAK_VBAT_DIVIDER=2.0f
;    -DSOAK_FRAMESIZE=FRAMESIZE_UXGA
;    -DSOAK_PERIOD_MS=0
;    -DSOAK_BEEP_EVERY=60

; No partition override. The board definition already selects default_8MB.csv --
; 3.34 MB of app against an image under 0.5 MB -- and it carries a coredump
; partition that huge_app.csv does not. On a run that exists to catch resets,
; keeping somewhere for a panic to land is worth more than app space nothing
; needs.
