; gps-check -- read the L76K-GNSS directly, no Meshtastic (js-rocket-avionics #6)
;
;     pio run -t upload && pio device monitor
;
; FLASH THIS ONTO XIAO-ESP32S3-cam ONLY. XIAO-ESP32S3-lora runs stock Meshtastic
; and must never be reflashed -- so have ONLY the cam board plugged in when you
; upload. PlatformIO uploads to the first port it finds, and with both boards
; on USB that can be the lora board.

[env:seeed_xiao_esp32s3]
; Pinned for the same reason as bringup-cam: the build lives in this file, not
; in whatever the machine's registry resolves `espressif32` to today.
platform      = espressif32@55.3.35
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200

; ARDUINO_USB_CDC_ON_BOOT puts Serial on the USB-C port, which is where the
; report comes out. Already in the board definition; restated because it is
; load-bearing -- see ../sense-board-PlatformIO.md.
;
; No PSRAM flag: nothing here allocates from it.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
