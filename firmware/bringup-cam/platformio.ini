; bringup-cam -- bench bring-up for the Sense stack (js-rocket-avionics #7)
;
;     pio run -t upload && pio device monitor
;
; Everything the build depends on is HERE rather than in IDE menu state. That
; is the reason this is a PlatformIO project and not a .ino: PSRAM and the
; partition table are build settings, and a sketch that only works when someone
; remembers to tick Tools > PSRAM is a sketch that fails on the next machine.

[env:seeed_xiao_esp32s3]
; Pinned. `espressif32` unpinned resolves to whatever that machine's registry
; offers, and this repo's whole reason for using PlatformIO over a .ino is that
; the build is in the file rather than in machine state. 55.3.35 is what these
; projects were built against, and its board definition is where PSRAM, the
; OPI memory type and the partition table actually come from.
platform      = espressif32@55.3.35
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200

; -DBOARD_HAS_PSRAM is not optional. The camera allocates its frame buffers in
; PSRAM (CAMERA_FB_IN_PSRAM); without this they fail to allocate and the camera
; init returns an error that reads like a hardware fault.
;
; ARDUINO_USB_CDC_ON_BOOT puts Serial on the USB-C port, which is the only way
; to see the PASS/FAIL output -- there is no UART broken out.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; No partition override, and the earlier claim that one was needed was wrong:
; this said "camera + SD_MMC + Arduino core does not fit the default app
; partition", which is true of a 4 MB board's 1.3 MB default and not of this one.
; The board definition selects default_8MB.csv -- 3.34 MB of app against an image
; under 0.5 MB -- and it keeps a coredump partition huge_app.csv drops.

; The three -D flags above are already in the board definition's extra_flags --
; see firmware/sense-board-PlatformIO.md. Restating them is deliberate: they are
; load-bearing, the board definition is not ours, and a silent upstream drop
; would surface as what looks like a hardware fault.
;
; esp_camera.h and SD_MMC ship with the Arduino ESP32 core, so no lib_deps.
; Both sensors are driven by direct register writes in main.cpp rather than by
; a vendor library -- see the comments there for why the register values are
; cited inline.
