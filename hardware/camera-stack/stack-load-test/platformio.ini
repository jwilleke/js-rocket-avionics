; stack-load-test -- the camera stack at flight load, everything at once
; (js-rocket-avionics #7, #24; design.md Verification item 4)
;
;     pio run -t upload && pio device monitor
;
; For XIAO-ESP32S3-cam (mj-cam) with the Sense board and a FAT32 microSD.
; NEVER upload with XIAO-ESP32S3-lora plugged in.
;
; Lives beside camera-stack.md because it tests that assembly, not one part;
; firmware/README.md lists it with the other projects.

[env:seeed_xiao_esp32s3]
platform      = espressif32@55.3.35
board         = seeed_xiao_esp32s3
framework     = arduino
monitor_speed = 115200

; -DBOARD_HAS_PSRAM: frame buffers and both logs live in PSRAM.
; ARDUINO_USB_CDC_ON_BOOT: the report comes out on the USB-C port.
; The three are already in the board definition and restated because they are
; load-bearing -- firmware/sense-board-PlatformIO.md.
;
; TEST_SECONDS  how long everything runs together
; FB_COUNT      camera frame buffers in PSRAM -- the queue that rides out card
;               stalls. 16 (~0.6 s) was not enough: a 798 ms stall emptied it and
;               cost a 792 ms gap (2026-09-12). 32 is ~1.3 s
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTEST_SECONDS=60
    -DFB_COUNT=32
